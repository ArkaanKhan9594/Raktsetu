name: raktsetu
description: "RaktSetu - Voluntary Blood Donor Registry & Emergency Request Platform"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  intl: ^0.19.0
  uuid: ^4.4.0
  table_calendar: ^3.1.2
  pin_code_fields: ^8.0.1
  url_launcher: ^6.3.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.4
  geolocator: ^13.0.2
  share_plus: ^10.1.4
  http: ^1.2.2

  # Firebase Production Integration
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
