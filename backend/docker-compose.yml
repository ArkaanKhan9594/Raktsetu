version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: raktsetu-postgres
    restart: always
    environment:
      POSTGRES_USER: raktsetu_user
      POSTGRES_PASSWORD: raktsetu_secure_password
      POSTGRES_DB: raktsetu_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  api:
    build: .
    container_name: raktsetu-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://raktsetu_user:raktsetu_secure_password@db:5432/raktsetu_db
      JWT_SECRET: raktsetu_production_jwt_secret_key_change_me
    depends_on:
      - db

volumes:
  pgdata:
